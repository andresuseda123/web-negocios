<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7F6FB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .tarjeta {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-bottom: 12px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #6C4EF5;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .mensaje { margin-top: 12px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>Crea tu nueva contraseña</h1>
    <input type="password" id="password" placeholder="Nueva contraseña (mín. 6 caracteres)" />
    <button onclick="guardarNuevaContrasena()">Guardar contraseña</button>
    <p class="mensaje" id="mensaje"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://yyrbjckencwlmdzgaajp.supabase.co';

    function obtenerAccessToken() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    async function guardarNuevaContrasena() {
      const password = document.getElementById('password').value;
      const mensaje = document.getElementById('mensaje');
      const accessToken = obtenerAccessToken();

      if (!accessToken) {
        mensaje.textContent = 'Enlace inválido o expirado. Solicita uno nuevo desde la app.';
        return;
      }
      if (password.length < 6) {
        mensaje.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
      }

      try {
        const respuesta = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`,
            'apikey': 'sb_publishable_o6mm4BN6rd39tiD1mFYHBA_xOcWC_C7',
          },
          body: JSON.stringify({ password }),
        });

        if (respuesta.ok) {
          mensaje.textContent = '¡Listo! Ya puedes volver a la app e iniciar sesión con tu nueva contraseña.';
          mensaje.style.color = 'green';
        } else {
          const datos = await respuesta.json();
          mensaje.textContent = 'Error: ' + (datos.msg || 'no se pudo cambiar la contraseña');
        }
      } catch (e) {
        mensaje.textContent = 'Error de conexión, intenta de nuevo.';
      }
    }
  </script>
</body>
</html>
