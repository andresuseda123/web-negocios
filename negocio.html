<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negocio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7F6FB;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .tarjeta {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icono {
      width: 64px;
      height: 64px;
      background: #6C4EF5;
      border-radius: 16px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .categoria {
      display: inline-block;
      background: #F0EEFC;
      color: #6C4EF5;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    p.descripcion { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 8px; }
    p.direccion { color: #888; font-size: 13px; margin-bottom: 24px; }
    .botones { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn-principal { background: #6C4EF5; color: white; }
    .btn-secundario { background: #F0EEFC; color: #6C4EF5; }
    .cargando, .error { color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <div class="tarjeta" id="contenido">
    <p class="cargando">Cargando información del negocio...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://yyrbjckencwlmdzgaajp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o6mm4BN6rd39tiD1mFYHBA_xOcWC_C7';

    // Extrae el ID del negocio desde la URL: tudominio.com/n/ID
    const partes = window.location.pathname.split('/').filter(Boolean);
    const negocioId = partes[partes.length - 1];

    const contenedor = document.getElementById('contenido');

    async function cargarNegocio() {
      if (!negocioId) {
        contenedor.innerHTML = '<p class="error">No se especificó ningún negocio.</p>';
        return;
      }

      try {
        const respuesta = await fetch(
          `${SUPABASE_URL}/rest/v1/negocios?id=eq.${negocioId}&select=*`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
            },
          }
        );
        const datos = await respuesta.json();

        if (!datos || datos.length === 0) {
          contenedor.innerHTML = '<p class="error">No se encontró este negocio.</p>';
          return;
        }

        const negocio = datos[0];

        contenedor.innerHTML = `
          <div class="icono">🏪</div>
          <h1>${negocio.nombre || 'Negocio'}</h1>
          ${negocio.categoria ? `<span class="categoria">${negocio.categoria}</span>` : ''}
          <p class="descripcion">${negocio.descripcion || ''}</p>
          <p class="direccion">${negocio.direccion || ''}</p>
          <div class="botones">
            <a class="btn btn-principal" href="#" id="btnAbrirApp">Abrir en la app</a>
            <a class="btn btn-secundario" href="#" id="btnDescargar">Descargar la app</a>
          </div>
        `;

        // Por ahora ambos botones llevan al mismo lugar (la tienda),
        // hasta que activemos el salto automático a la app instalada.
        const enlaceTienda = 'https://play.google.com/store/apps'; // lo actualizamos cuando publiquemos
        document.getElementById('btnAbrirApp').href = enlaceTienda;
        document.getElementById('btnDescargar').href = enlaceTienda;
      } catch (e) {
        contenedor.innerHTML = '<p class="error">Error al cargar la información.</p>';
      }
    }

    cargarNegocio();
  </script>
</body>
</html>
